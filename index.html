<script>
document.documentElement.classList.add('js');
(function(){
  'use strict';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  //====【新增音频，不改动原有其他代码】====
  const audioScene1 = new Audio("./1.mp3");
  const audioScene2 = new Audio("./2.mp3");
  const sceneAudioMap = {
    "市场": audioScene1,
    "大厅": audioScene2
  };
  let currentAudio = null;

  function stopAllAudio(){
    if(currentAudio){
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
  }
  //=========================================

  /* ---------- 阅读进度 ---------- */
  var bar = document.getElementById('progress');
  function onScroll(){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var top = window.pageYOffset || document.documentElement.scrollTop;
    var p = h > 0 ? top / h : 0;
    bar.style.width = Math.min(100, Math.max(0, p * 100)) + '%';
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  onScroll();
  /* ---------- 提示条 ---------- */
  var toastEl = document.getElementById('toast'), toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2800);
  }
  /* ---------- 入场显隐 ---------- */
  var reveals = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
  var qItems  = Array.prototype.slice.call(document.querySelectorAll('.qs-item'));
  if ('IntersectionObserver' in window && !reduced){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting){
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    }, {rootMargin:'0px 0px -9% 0px', threshold:0.08});
    reveals.forEach(function(el){
      if (qItems.indexOf(el) === -1) io.observe(el);
    });
    /* 三个问题：滑入出现，滑出收起 */
    var qio = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) en.target.classList.add('in');
        else en.target.classList.remove('in');
      });
    }, {rootMargin:'-8% 0px -16% 0px', threshold:0.45});
    qItems.forEach(function(el){ qio.observe(el); });
  } else {
    reveals.forEach(function(el){ el.classList.add('in'); });
  }

  /* ---------- 场景卡：触碰展开对话【在这里加入音频调用，DOM完全不动】 ---------- */
  var scenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
  var voiceHinted = false;
  scenes.forEach(function(sc){
    function toggle(){
      var open = sc.getAttribute('aria-expanded') === 'true';
      const sceneKey = sc.dataset.scene;

      scenes.forEach(function(other){
        if (other !== sc) other.setAttribute('aria-expanded','false');
      });

      if(open){
        sc.setAttribute('aria-expanded','false');
        stopAllAudio(); //关闭卡片，停止音频
      }else{
        sc.setAttribute('aria-expanded','true');
        stopAllAudio();
        //如果该场景存在音频对象，则尝试播放
        if(sceneAudioMap[sceneKey]){
          currentAudio = sceneAudioMap[sceneKey];
          currentAudio.currentTime = 0;
          currentAudio.play().catch(err=>{
            console.warn("音频播放异常:",err);
            //本地file协议会进到这里，线上部署不会触发
          });
        }

        if (!voiceHinted){
          voiceHinted = true;
          if(sceneKey !== "院落"){
            toast("正在播放场景对话音频");
          }
        }
      }
    }
    sc.addEventListener('click', toggle);
    sc.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
        e.preventDefault(); toggle();
      }
    });
  });

  /* ---------- 闯关东路线【完全沿用原始代码，没有修改】 ---------- */
  var NODES = [
    {t:'出发地 · 山东乡村',
     b:'黄河下游的水患、旱灾与连年战乱，把一批批农户、手艺人和小生意人推出了家门。上路时他们说的是各村各乡的土话——同一个县，隔一条河，腔调就可能不一样。<b>从哪来、到哪去：</b>从山东内地乡村出发，往东北去。'},
    {t:'陆路 · 出山海关',
     b:'陆路沿官道与铁路北上，山海关是那道最有名的关口。人和口音一起挤在关口前：鲁西的、冀东的、辽西的，谁也不是谁的老乡。<b>语言上发生了什么：</b>各地口音第一次长时间混在同一个队列里。'},
    {t:'海路 · 胶东渡海',
     b:'从胶东半岛的码头出发，一夜或数日渡到辽东。船上、码头边、落脚客栈里，最先被磨平的，是方言里那些外人根本听不明白的说法。<b>语言上发生了什么：</b>共同的说法开始替代各自的土话。'},
    {t:'落脚 · 东北村镇',
     b:'落脚的地方多是自己同乡聚起来的村落，也有铁路沿线的工棚和煤矿。同乡之间照样说土话；一旦要和外乡人打交道，就得换一种说法。<b>语言上发生了什么：</b>对内一套、对外一套，两种说法并行。'},
    {t:'融合 · 集市与工棚',
     b:'集市、工地、矿山，是各路口音真正混在一起的地方。人们在这里学会用彼此都听得懂的话讲价、分工、拌嘴、和好。<b>落点：</b>一条共同的交往语言，就是这么长出来的。'}
  ];
  var LEGS = {0:['leg1','leg3'], 1:['leg2'], 2:['leg4'], 3:['leg5'], 4:[]};
  var visited = {};
  var nodeEls = Array.prototype.slice.call(document.querySelectorAll('.node'));
  var miEmpty = document.getElementById('mi-empty');
  var miTitle = document.getElementById('mi-title');
  var miBody  = document.getElementById('mi-body');
  var mapCount = document.getElementById('map-count');
  var mapConcl = document.getElementById('map-concl');
  function renderMap(){
    var n = Object.keys(visited).length;
    Object.keys(LEGS).forEach(function(k){
      var on = visited[k] ? '1' : '0';
      LEGS[k].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.setAttribute('data-on', on);
      });
    });
    nodeEls.forEach(function(el, i){
      el.setAttribute('data-on', visited[i] ? '1' : '0');
    });
    mapCount.textContent = '已点亮 ' + n + ' / 5';
    if (n === 5) mapConcl.classList.add('on');
    else mapConcl.classList.remove('on');
  }
  function showNode(i){
    miEmpty.hidden = true;
    miTitle.hidden = false;
    miBody.hidden = false;
    miTitle.textContent = NODES[i].t;
    miBody.innerHTML = NODES[i].b;
  }
  nodeEls.forEach(function(el){
    var i = parseInt(el.getAttribute('data-i'), 10);
    function fire(){
      visited[i] = true;
      showNode(i);
      renderMap();
    }
    el.addEventListener('click', fire);
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
        e.preventDefault(); fire();
      }
    });
  });
  document.getElementById('map-reset').addEventListener('click', function(){
    visited = {};
    renderMap();
    miEmpty.hidden = false;
    miTitle.hidden = true;
    miBody.hidden = true;
    toast('路线已清空，可以重新逐点点亮。');
  });
  renderMap();
})();
</script>
